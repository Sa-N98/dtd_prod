<div class="login_page active" id="page-login_page">
  <div class="ui-card elevated login-card">
    <header class="ui-card-header">
      <div class="login-ico">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 018 0v4"/>
        </svg>
      </div>
      <div>
        <h1>Login</h1>
        <p class="sub">Sign in to continue</p>
      </div>
    </header>
    <div class="ui-card-body">
      <form id="login-form">
        <div class="ui-field">
          <input class="ui-input" type="text" placeholder="Email" name="email" required>
        </div>
        <div class="ui-field">
          <input class="ui-input" type="password" placeholder="Password" name="password" required>
        </div>
        <p id="login-error"></p>
        <button class="ui-btn" type="submit">Login</button>
      </form>
    </div>
  </div>
</div>
